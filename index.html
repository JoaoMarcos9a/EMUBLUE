<!-- Modal de Instalação Real -->
<div class="modal" id="install-modal">
    <div class="modal-content">
        <h3>Instalador de APK</h3>
        <p style="font-size: 12px; color: #888;">Selecione um arquivo .apk do seu dispositivo</p>
        
        <input type far-field="false" type="file" id="apk-file-input" accept=".apk" style="margin-bottom: 20px;">
        
        <div id="upload-status" style="display:none; font-size: 14px; color: var(--accent);">
            Processando pacote... <span id="progress">0%</span>
        </div>

        <div class="modal-buttons">
            <button onclick="startInstallation()" id="btn-install-real">Instalar Agora</button>
            <button onclick="closeModal()">Cancelar</button>
        </div>
    </div>
</div>
